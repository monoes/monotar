# Generated by monomind init --codex.
# This project-scoped config is loaded only when the project is trusted.

[features]
hooks = true

[tui]
status_line = ["model-with-reasoning", "project-root", "git-branch", "context-remaining", "task-progress", "status"]

[mcp_servers.monomind]
command = "npx"
args = ["-y", "monomind@latest", "mcp", "start"]
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 120
env = { npm_config_update_notifier = "false", MONOMIND_MODE = "v1", MONOMIND_HOOKS_ENABLED = "true", MONOMIND_TOPOLOGY = "hierarchical-mesh", MONOMIND_MAX_AGENTS = "15", MONOMIND_MEMORY_BACKEND = "hybrid" }

# monomind:start native-hooks
[[hooks.PreToolUse]]
matcher = ".*"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "node .codex/hooks/monomind-hook.cjs"
command_windows = "node .codex\\\\hooks\\\\monomind-hook.cjs"
statusMessage = "Monomind pre-tool checks"
timeout = 5

[[hooks.PostToolUse]]
matcher = ".*"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "node .codex/hooks/monomind-hook.cjs"
command_windows = "node .codex\\\\hooks\\\\monomind-hook.cjs"
statusMessage = "Monomind post-tool learning"
timeout = 10

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "node .codex/hooks/monomind-hook.cjs"
command_windows = "node .codex\\\\hooks\\\\monomind-hook.cjs"
statusMessage = "Monomind session restore"
timeout = 3

[[hooks.SessionEnd]]
[[hooks.SessionEnd.hooks]]
type = "command"
command = "node .codex/hooks/monomind-hook.cjs"
command_windows = "node .codex\\\\hooks\\\\monomind-hook.cjs"
statusMessage = "Monomind session persistence"
timeout = 3
# monomind:end native-hooks
