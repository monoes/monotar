name: CI

# NOTE: this workflow covers unit/contract tests only. It does not run real
# LiveKit media, real STT/LLM/TTS against live services, or real LiveTalking/
# Wav2Lip avatar rendering — those need real model weights, PyTorch, and (for
# MuseTalk) CUDA hardware this CI runner doesn't have. See "Post-Plan Manual
# Verification" in docs/mastermind/plans/2026-09-05-avatar-platform-phase4-9.md
# for the real end-to-end check.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: monotar
          POSTGRES_DB: monotar
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci-only-ephemeral' }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monotar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://monotar:ci-only-ephemeral@localhost:5432/monotar
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @monotar/api exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @monotar/web build
      - run: pnpm security:scan-bundle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          cd services/stt
          pip install -r requirements.txt
          pip install grpcio-tools
          ./scripts/gen_proto.sh
          python -m pytest -v
