services:
  postgres:
    image: postgres:16.4
    env_file: .env.local
    environment:
      POSTGRES_USER: monotar
      POSTGRES_DB: monotar
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monotar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    env_file: .env.local
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  livekit:
    image: livekit/livekit-server:v1.7.2
    command: --dev --bind 0.0.0.0
    env_file: .env.local
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]

  coturn:
    image: coturn/coturn:4.6.2
    env_file: .env.local
    network_mode: host
    command: >
      -n --log-file=stdout
      --listening-port=3478
      --min-port=49160 --max-port=49200
      --realm=monotar.local
      --use-auth-secret
      --static-auth-secret=$$TURN_SECRET

volumes:
  pgdata:
  minio-data:
